# scripts/docker-azure.mjs supplies these bind-mount settings and refreshes the
# short-lived token. Configure your resources in ignored .env.azure.local.
services:
  credit-api:
    user: "${CREDIT_LOCAL_UID:?Run node scripts/docker-azure.mjs}:${CREDIT_LOCAL_GID:?Run node scripts/docker-azure.mjs}"
    restart: unless-stopped
    environment:
      DOCUMENT_ANALYSIS_MODE: azure
      AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT: ${AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT:?Configure .env.azure.local or export your Document Intelligence endpoint}
      AZURE_DOCUMENT_INTELLIGENCE_MODEL: prebuilt-layout
      AZURE_DOCUMENT_INTELLIGENCE_MAX_PAGES: "2"
      AZURE_DOCUMENT_INTELLIGENCE_CREDENTIAL: token-file
      AZURE_DOCUMENT_INTELLIGENCE_TOKEN_FILE: /run/azure-auth/token.json
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:?Configure .env.azure.local or export your Azure OpenAI endpoint}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT:?Set the name of your deployed chat model}
      AZURE_OPENAI_CREDENTIAL: token-file
      AZURE_OPENAI_TOKEN_FILE: /run/azure-auth/token.json
      AZURE_AI_REQUIRED: "true"
      # Local interactive testing only; finite reservations, not billed token counts.
      AI_REQUESTS_PER_MINUTE: "12"
      AI_DAILY_ACCOUNT_BUDGET: "150000"
      AI_DAILY_TENANT_BUDGET: "300000"
      JAVA_TOOL_OPTIONS: -Xmx384m -XX:ActiveProcessorCount=2
    volumes:
      - type: bind
        source: ${CREDIT_AZURE_TOKEN_DIR:?Run node scripts/docker-azure.mjs}
        target: /run/azure-auth
        read_only: true
  web:
    restart: unless-stopped
  keycloak:
    restart: unless-stopped
  case-db:
    restart: unless-stopped
  identity-db:
    restart: unless-stopped
