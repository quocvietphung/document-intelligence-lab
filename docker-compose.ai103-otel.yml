# AI-103 opt-in tracing (exercise 2g). Add to the production file list ONLY for the tracing exercise:
#   mkdir -p .local/ai103/otel && chmod 777 .local/ai103/otel
#   OLLAMA_CHAT_MODEL=qwen3:4b-instruct-2507-q4_K_M docker compose \
#     -f docker-compose.yml -f docker-compose.platform.yml -f docker-compose.docling.yml \
#     -f docker-compose.nova-local.yml -f docker-compose.etl.yml -f docker-compose.local-resources.yml \
#     -f docker-compose.m365.yml -f docker-compose.ai103-otel.yml up -d otel-collector credit-api
# Return to the normal stack afterwards with `node scripts/docker-local.mjs --no-build` (volumes are kept).
# The collector listens on loopback only and writes .local/ai103/otel/traces.jsonl. No cloud export.
services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.136.0
    command: ["--config=/etc/otelcol/config.yml"]
    volumes:
      - ./infra/observability/otel-ai103-file.yml:/etc/otelcol/config.yml:ro
      - ./.local/ai103/otel:/otel
    ports:
      - "127.0.0.1:4318:4318"
    restart: unless-stopped
    mem_limit: 256m
    cpus: 1
  credit-api:
    environment:
      OTEL_ENABLED: "true"
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
    depends_on:
      otel-collector:
        condition: service_started
