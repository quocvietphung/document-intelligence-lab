<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background gradient circle -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0284c7;stop-opacity:1" />
    </linearGradient>
  </defs>
  <circle cx="50" cy="50" r="50" fill="url(#grad1)"/>

  <!-- Finance symbol - stylized Euro with upward arrow -->
  <g transform="translate(50, 50)">
    <!-- Euro symbol -->
    <path d="M -5 -15 Q -5 -20 0 -20 L 8 -20" stroke="white" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M -5 -5 L 8 -5" stroke="white" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M -5 5 Q -5 10 0 10 L 8 10" stroke="white" stroke-width="3" fill="none" stroke-linecap="round"/>

    <!-- Upward arrow -->
    <path d="M 15 5 L 15 -8 M 15 -8 L 10 -3 M 15 -8 L 20 -3" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>

