# Add to base + platform. An explicit model must already be pulled; startup never downloads one.
services:
  web:
    environment:
      NOVA_PROVIDER: ollama
  ollama:
    image: document-lab-ollama-cpu:0.40.16
    build:
      context: ./services/ollama-cpu
    restart: unless-stopped
    # Non-root, fixed identity (UID/GID 10010, also set in the image). Root filesystem read-only; the only writable
    # scratch space is a tmpfs; no Linux capabilities and no privilege escalation.
    user: "10010:10010"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:size=512m,mode=1777
    environment:
      OLLAMA_MODELS: /models
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_MAX_QUEUE: "2"
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-5m}
      # Single-user CPU lab: reuse the active slot, not multi-prompt RAM snapshots.
      LLAMA_ARG_CACHE_RAM: "0"
      LLAMA_ARG_THREADS: "3"
      OLLAMA_CONTEXT_LENGTH: "4096"
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:?Choose an explicitly installed local model}
    volumes:
      # The model store is the `models` folder of the persistent volume. Mounting that subfolder keeps the existing
      # data where it is; the one-time ownership change for the non-root user is in docs/AI103_VERIFICATION.md.
      - type: volume
        source: lab_ollama
        target: /models
        volume:
          subpath: models
    networks: [local_models]
    mem_limit: 5g
    cpus: 3
    healthcheck:
      test: ["CMD-SHELL", "ollama show \"$$OLLAMA_CHAT_MODEL\" >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 20
  credit-api:
    environment:
      NOVA_PROVIDER: ollama
      OLLAMA_URL: http://ollama:11434
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:?Choose an explicitly installed local model}
      OLLAMA_VISION_MODEL: ${OLLAMA_VISION_MODEL:-}
      AZURE_OPENAI_ENDPOINT: ""
      AZURE_OPENAI_DEPLOYMENT: ""
      AZURE_AI_REQUIRED: "false"
      AI_DAILY_ACCOUNT_BUDGET: "150000"
      AI_DAILY_TENANT_BUDGET: "500000"
    networks: [default, local_models]
    depends_on:
      ollama:
        condition: service_healthy
networks:
  local_models:
    internal: true
volumes:
  lab_ollama:
    # Explicit preparation owns this persistent volume, not Compose teardown.
    external: true
    name: credit-intelligence-lab_lab_ollama
