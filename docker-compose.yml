name: credit-intelligence-lab
services:
  case-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: credit_cases
      POSTGRES_USER: credit_lab
      POSTGRES_PASSWORD: local-cases-only
    volumes:
      - credit_cases:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U credit_lab -d credit_cases"]
      interval: 5s
      timeout: 3s
      retries: 12
  identity-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: local-database-only
    volumes:
      - identity_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 3s
      retries: 12

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    command: start-dev --cache=ispn --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: local-admin-only
      KC_HOSTNAME: http://localhost:8080
      KC_HEALTH_ENABLED: "true"
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://identity-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: local-database-only
      KC_FEATURES: stateless
      KC_CACHE_EMBEDDED_CLUSTER_NAME: credit-local
      KC_CACHE_EMBEDDED_NETWORK_BIND_ADDRESS: LOOPBACK
    volumes:
      - ./infra/keycloak/credit-intelligence-realm.json:/opt/keycloak/data/import/realm.json:ro
    depends_on:
      identity-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000; echo -e 'GET /health/ready HTTP/1.1\r\nhost: localhost\r\nConnection: close\r\n\r\n' >&3; grep '200 OK' <&3"]
      interval: 10s
      timeout: 5s
      retries: 18

  credit-api:
    build: ./services/credit-api
    environment:
      KEYCLOAK_ISSUER: http://localhost:8080/realms/credit-intelligence
      KEYCLOAK_JWK_URI: http://keycloak:8080/realms/credit-intelligence/protocol/openid-connect/certs
      SECURITY_ENABLED: "true"
      CASE_PERSISTENCE_ENABLED: "true"
      CASE_WRITES_ENABLED: "true"
      CASE_DATABASE_URL: jdbc:postgresql://case-db:5432/credit_cases
      CASE_DATABASE_USER: credit_lab
      CASE_DATABASE_PASSWORD: local-cases-only
      OCR_ENABLED: "true"
      DOCUMENT_ANALYSIS_MODE: local
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      case-db:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 4s
      retries: 12

  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_KEYCLOAK_URL: http://localhost:8080
        NEXT_PUBLIC_KEYCLOAK_REALM: credit-intelligence
        NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: credit-intelligence-web
    environment:
      CREDIT_API_URL: http://credit-api:8080
    volumes:
      - type: bind
        source: ./.local/reference-pdfs
        target: /app/.local/reference-pdfs
        read_only: true
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      credit-api:
        condition: service_healthy

volumes:
  credit_cases:
  identity_postgres:
  # Retained for recovery of the earlier local H2 demo; not mounted by new runs.
  keycloak_data:
