name: credit-azure-lab
x-logging: &logging
  driver: json-file
  options: {max-size: "5m", max-file: "2"}
services:
  gateway:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    environment:
      BACKEND_HOST: ${BACKEND_HOST:?backend DNS required}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - tls_data:/data
      - tls_config:/config
    mem_limit: 192m
    logging: *logging
  case-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: credit_cases
      POSTGRES_USER: credit_lab
      POSTGRES_PASSWORD: ${CASE_PASSWORD:?private runtime env required}
    volumes: ["credit_cases:/var/lib/postgresql/data"]
    mem_limit: 384m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U credit_lab -d credit_cases"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging
  identity-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${IDENTITY_PASSWORD:?private runtime env required}
    volumes: ["identity_postgres:/var/lib/postgresql/data"]
    mem_limit: 384m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging
  keycloak:
    build:
      context: .
      dockerfile: Dockerfile.keycloak
    restart: unless-stopped
    command: ["start", "--optimized", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://identity-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${IDENTITY_PASSWORD:?private runtime env required}
      KC_BOOTSTRAP_ADMIN_USERNAME: labadmin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${ADMIN_PASSWORD:?private runtime env required}
      KC_HOSTNAME: https://${BACKEND_HOST:?backend DNS required}/auth
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /auth
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME_STRICT: "true"
      KC_FEATURES: stateless
      KC_CACHE_EMBEDDED_CLUSTER_NAME: credit-azure-vm
      KC_CACHE_EMBEDDED_NETWORK_BIND_ADDRESS: LOOPBACK
      JAVA_OPTS_KC_HEAP: -Xms64m -Xmx512m
    ports: ["127.0.0.1:8080:8080"]
    volumes:
      - /opt/credit-lab/secrets/realm.json:/opt/keycloak/data/import/realm.json:ro
    depends_on:
      identity-db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "bash", "-ec", "exec 3<>/dev/tcp/127.0.0.1/8080; printf 'GET /auth/realms/credit-intelligence/.well-known/openid-configuration HTTP/1.0\r\nHost: localhost\r\nX-Forwarded-Proto: https\r\n\r\n' >&3; head -n 1 <&3 | grep -q '200'"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 30
    mem_limit: 1024m
    logging: *logging
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "64mb", "--maxmemory-policy", "noeviction"]
    volumes: ["lab_limits:/data"]
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20
    logging: *logging
  qdrant:
    image: qdrant/qdrant:v1.19.1
    restart: unless-stopped
    volumes: ["lab_vectors:/qdrant/storage"]
    mem_limit: 512m
    logging: *logging
  clamav:
    image: clamav/clamav:stable
    restart: unless-stopped
    volumes: ["lab_virus_definitions:/var/lib/clamav"]
    mem_limit: 2048m
    healthcheck:
      test: ["CMD", "clamdscan", "--ping=1"]
      interval: 20s
      timeout: 10s
      retries: 45
      start_period: 180s
    logging: *logging
  storage-init:
    image: busybox:1.37
    user: root
    command: ["sh", "-c", "chown 1000:1000 /documents && chmod 700 /documents"]
    volumes: ["lab_documents:/documents"]
    logging: *logging
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.136.0
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yml"]
    volumes: ["./otel.yml:/etc/otelcol/config.yml:ro"]
    mem_limit: 192m
    logging: *logging
  credit-api:
    build:
      context: ./credit-api
    restart: unless-stopped
    environment:
      SECURITY_ENABLED: "true"
      CASE_PERSISTENCE_ENABLED: "true"
      CASE_WRITES_ENABLED: "true"
      CASE_DATABASE_URL: jdbc:postgresql://case-db:5432/credit_cases
      CASE_DATABASE_USER: credit_lab
      CASE_DATABASE_PASSWORD: ${CASE_PASSWORD:?private runtime env required}
      KEYCLOAK_ISSUER: https://${BACKEND_HOST}/auth/realms/credit-intelligence
      KEYCLOAK_JWK_URI: http://keycloak:8080/auth/realms/credit-intelligence/protocol/openid-connect/certs
      DOCUMENT_ANALYSIS_MODE: azure
      AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT: https://vietphung-documents-shared.cognitiveservices.azure.com/
      AZURE_DOCUMENT_INTELLIGENCE_MODEL: prebuilt-layout
      AZURE_DOCUMENT_INTELLIGENCE_MAX_PAGES: "2"
      AZURE_DOCUMENT_INTELLIGENCE_CREDENTIAL: default
      AZURE_OPENAI_ENDPOINT: https://vietphung-ai-shared.openai.azure.com/
      AZURE_OPENAI_DEPLOYMENT: gpt-4.1-mini
      AZURE_OPENAI_CREDENTIAL: default
      AZURE_AI_REQUIRED: "true"
      LOCAL_EMBEDDINGS_ENABLED: "true"
      QDRANT_URL: http://qdrant:6333
      REDIS_HOST: redis
      REDIS_LIMITS_ENABLED: "true"
      CLAMAV_HOST: clamav
      DOCUMENT_STORAGE_ROOT: /app/documents
      DOCUMENT_RETENTION_DAYS: "30"
      PAYROLL_REFERENCE_ROOT: /app/references
      OTEL_ENABLED: "true"
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      JAVA_TOOL_OPTIONS: -Xmx768m -XX:ActiveProcessorCount=2
    ports: ["127.0.0.1:8081:8080"]
    volumes: ["lab_documents:/app/documents", "./references:/app/references:ro"]
    depends_on:
      case-db: {condition: service_healthy}
      identity-db: {condition: service_healthy}
      redis: {condition: service_healthy}
      clamav: {condition: service_healthy}
      qdrant: {condition: service_started}
      keycloak: {condition: service_healthy}
      storage-init: {condition: service_completed_successfully}
      otel-collector: {condition: service_started}
    mem_limit: 1536m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 30
    logging: *logging
volumes:
  credit_cases: {}
  identity_postgres: {}
  lab_limits: {}
  lab_vectors: {}
  lab_documents: {}
  lab_virus_definitions: {}
  tls_data: {}
  tls_config: {}
