# Opt in only after reviewing the destination/retention. No logs, bodies, prompts or PDF text.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
processors:
  filter/no_events:
    error_mode: propagate
    traces:
      span:
        - 'Len(links) > 0'
      spanevent:
        - 'true'
  transform/privacy:
    error_mode: propagate
    trace_statements:
      - context: resource
        statements:
          - keep_keys(attributes, ["service.name"])
          - set(attributes["service.name"], "document-intelligence-lab")
      - context: scope
        statements:
          - keep_keys(attributes, [])
          - set(name, "lab")
          - set(version, "")
      - context: span
        statements:
          - keep_keys(attributes, ["http.request.method", "http.method", "http.response.status_code", "http.status_code", "provider"])
          - set(name, "lab operation")
          - set(status.message, "")
  batch: {}
exporters:
  azuremonitor:
    connection_string: ${env:APPLICATIONINSIGHTS_CONNECTION_STRING}
service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [filter/no_events, transform/privacy, batch]
      exporters: [azuremonitor]
