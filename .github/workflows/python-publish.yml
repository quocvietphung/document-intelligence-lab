name: Publish Python package (manual)

on:
  workflow_dispatch:
    inputs:
      registry:
        description: 'Registry; configure its protected environment and Trusted Publisher first'
        type: choice
        options: [testpypi, pypi]
        default: testpypi

permissions:
  contents: read

jobs:
  build:
    if: startsWith(github.ref, 'refs/tags/python-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require matching package version and release tag
        env:
          RELEASE_TAG: '${{ github.ref_name }}'
        run: |
          python - <<'PY'
          import os, tomllib
          from pathlib import Path
          version = tomllib.loads(Path('python/pyproject.toml').read_text())['project']['version']
          assert os.environ['RELEASE_TAG'] == 'python-v' + version, 'Tag and package version differ'
          PY
      - run: python -m pip install './python[dev]'
      - run: python -m unittest discover -s python/tests -v
      - run: python -m build python
      - run: python -m twine check python/dist/*
      - run: python python/tools/check_distribution.py python/dist
      - uses: actions/upload-artifact@v4
        with:
          name: release-distributions
          path: python/dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: '${{ inputs.registry }}'
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-distributions
          path: dist
      - name: Publish approved distributions using OIDC
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: '${{ inputs.registry == ''pypi'' && ''https://upload.pypi.org/legacy/'' || ''https://test.pypi.org/legacy/'' }}'
