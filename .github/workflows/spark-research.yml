name: Spark research experiment (non-production, not deployed)

# Spark is an optional local scalability benchmark. It is not part of the production Compose stack,
# the Azure VM deployment or the production image gate. This workflow keeps its tests and its real
# image vulnerabilities visible. A red result here does not mean the production deployment contains Spark.
on:
  pull_request:
    paths:
      - "services/document-spark/**"
      - "docker-compose.spark.yml"
      - "scripts/run-document-spark.mjs"
      - ".github/workflows/spark-research.yml"
  push:
    branches: [master, develop, "codex/**", "feature/**"]
    paths:
      - "services/document-spark/**"
      - "docker-compose.spark.yml"
      - "scripts/run-document-spark.mjs"
      - ".github/workflows/spark-research.yml"
  schedule:
    - cron: "17 5 * * 1"  # weekly, so findings in bundled upstream JARs stay visible
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spark-parity-tests:
    name: Spark research - DuckDB parity tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 21}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip, cache-dependency-path: services/document-spark/requirements.txt}
      - run: python -m pip install -r services/document-spark/requirements.txt
      - run: python -B -m unittest discover -s services/document-spark -p 'test_*.py'
        env:
          PYTHONPATH: services/document-ml:services/document-etl
          TEST_SPARK: '1'
          SPARK_LOCAL_IP: 127.0.0.1
          PYSPARK_SUBMIT_ARGS: '--driver-memory 1g pyspark-shell'

  spark-image-security:
    name: Spark research image - Trivy HIGH/CRITICAL (not deployed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: State what this job covers
        run: |
          {
            echo "### Spark research image (not part of production)"
            echo "This job scans document-lab-spark:1, an optional local benchmark image."
            echo "It is excluded from the production Compose stack and from the Azure VM deployment."
            echo "Findings below are real and unsuppressed; they come from JARs bundled with PySpark/Hadoop."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Build the Spark research image
        run: docker build -f services/document-spark/Dockerfile -t document-lab-spark:1 .
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: document-lab-spark:1
          severity: HIGH,CRITICAL
          exit-code: "1"
