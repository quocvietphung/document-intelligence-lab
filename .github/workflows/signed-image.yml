name: Manually publish signed lab image
on:
  workflow_dispatch: {}
permissions:
  contents: read
  packages: write
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: container-release
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/credit-api" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: services/credit-api
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          sbom: true
          provenance: mode=max
      - uses: sigstore/cosign-installer@v4.1.0
      - name: Sign digest with GitHub OIDC (no signing key)
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
