name: M365 document evidence PoC

# Verification only. This workflow never deploys, never logs in to Azure and never uses stored cloud credentials.
on:
  pull_request:
    paths:
      - "services/m365-mcp-poc/**"
      - "infra/azure/vm-lab/**"
      - ".github/workflows/m365-mcp-poc.yml"
  push:
    branches: [master, develop, "feature/**"]
    paths:
      - "services/m365-mcp-poc/**"
      - "infra/azure/vm-lab/**"
      - ".github/workflows/m365-mcp-poc.yml"

permissions:
  contents: read

concurrency:
  group: m365-mcp-poc-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: services/m365-mcp-poc

jobs:
  python:
    name: Python ${{ matrix.python }} (tests, lint, types, audit, build)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned development lock
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e . --no-deps
      - name: Format and lint
        run: |
          python -m ruff format --check src tests
          python -m ruff check src tests
      - name: Type check (strict)
        run: python -m mypy
      - name: Unit and contract tests
        run: python -m pytest -q
      - name: Offline evaluation (synthetic regression, not production accuracy)
        run: python -m m365_poc.evaluation --out "$RUNNER_TEMP/eval-report.json"
      - name: Static security scan (bandit)
        run: python -m bandit -q -r src -c pyproject.toml
      - name: Dependency vulnerability audit
        run: python -m pip_audit -r requirements-dev.txt
      - name: Build package
        run: python -m build --outdir "$RUNNER_TEMP/dist" .

  docker:
    name: Container build and health check
    runs-on: ubuntu-latest
    needs: python
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f services/m365-mcp-poc/Dockerfile -t m365-document-evidence-poc:ci .
      - name: Start container and check health
        run: |
          docker run -d --name poc-ci -p 127.0.0.1:8765:8765 --read-only --tmpfs /tmp \
            -e M365_POC_ALLOW_UNAUTHENTICATED_LOCAL_DOCKER=1 m365-document-evidence-poc:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/health; then exit 0; fi
            sleep 2
          done
          docker logs poc-ci || true
          exit 1
      - name: Stop container
        if: always()
        run: docker rm -f poc-ci || true

  secrets:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "false"

  terraform:
    name: Terraform format and validation (no backend, no plan, no apply)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/azure/vm-lab
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -lockfile=readonly -input=false
      - run: terraform validate
