name: Verify platform
on:
  pull_request:
  push:
    branches: [master, develop, "codex/**", "feature/**"]
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  java-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/credit-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21, cache: maven }
      - run: mvn --batch-mode verify
  keycloak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-go@v5
        with: { go-version: '1.25', cache: false }
      - run: node scripts/test-keycloak-config.mjs
      - run: go test main.go main_test.go
        working-directory: infra/keycloak/proxy
  docker-oauth:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: docker compose up --build --wait --wait-timeout 180
      - run: TEST_LOCAL_AI_UNAVAILABLE=1 TEST_WRITE=1 TEST_RESTART_KEYCLOAK=1 TEST_RESTART_API=1 node scripts/test-oauth.mjs
      - if: failure()
        run: docker compose logs --tail=100
      - if: always()
        run: docker compose down
