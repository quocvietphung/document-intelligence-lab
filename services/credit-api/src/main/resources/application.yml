server:
  port: ${PORT:${SERVER_PORT:8080}}
spring:
  application:
    name: credit-api
  servlet:
    multipart:
      max-file-size: 3MB
      max-request-size: 4MB
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8080/realms/credit-intelligence}
          jwk-set-uri: ${KEYCLOAK_JWK_URI:http://localhost:8080/realms/credit-intelligence/protocol/openid-connect/certs}
app:
  persistence:
    enabled: ${CASE_PERSISTENCE_ENABLED:false}
    url: ${CASE_DATABASE_URL:}
    user: ${CASE_DATABASE_USER:}
    password: ${CASE_DATABASE_PASSWORD:}
  writes-enabled: ${CASE_WRITES_ENABLED:false}
  ocr-enabled: ${OCR_ENABLED:false}
  document-intelligence:
    mode: ${DOCUMENT_ANALYSIS_MODE:local}
    endpoint: ${AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT:}
    model-id: ${AZURE_DOCUMENT_INTELLIGENCE_MODEL:prebuilt-layout}
    max-pages: ${AZURE_DOCUMENT_INTELLIGENCE_MAX_PAGES:4}
    credential: ${AZURE_DOCUMENT_INTELLIGENCE_CREDENTIAL:default}
    token-file: ${AZURE_DOCUMENT_INTELLIGENCE_TOKEN_FILE:}
  ai:
    requests-per-minute: ${AI_REQUESTS_PER_MINUTE:6}
    tenant-requests-per-minute: ${AI_TENANT_REQUESTS_PER_MINUTE:60}
    daily-account-budget: ${AI_DAILY_ACCOUNT_BUDGET:30000}
    daily-tenant-budget: ${AI_DAILY_TENANT_BUDGET:100000}
    endpoint: ${AZURE_OPENAI_ENDPOINT:}
    deployment: ${AZURE_OPENAI_DEPLOYMENT:}
    credential: ${AZURE_OPENAI_CREDENTIAL:default}
    token-file: ${AZURE_OPENAI_TOKEN_FILE:}
    required: ${AZURE_AI_REQUIRED:false}
  security:
    enabled: ${SECURITY_ENABLED:true}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
spring.flyway.enabled: ${CASE_PERSISTENCE_ENABLED:false}
spring.flyway.baseline-on-migrate: true
spring.flyway.baseline-version: 0
spring.data.redis.host: ${REDIS_HOST:localhost}
spring.data.redis.port: ${REDIS_PORT:6379}
spring.data.redis.timeout: 2s
app.platform.embeddings: ${LOCAL_EMBEDDINGS_ENABLED:false}
app.platform.qdrant-url: ${QDRANT_URL:}
app.platform.redis-enabled: ${REDIS_LIMITS_ENABLED:false}
app.platform.clamav-host: ${CLAMAV_HOST:}
app.platform.clamav-port: ${CLAMAV_PORT:3310}
app.platform.storage-root: ${DOCUMENT_STORAGE_ROOT:/tmp/credit-lab-objects}
app.platform.blob-endpoint: ${AZURE_BLOB_ENDPOINT:}
app.platform.blob-container: ${AZURE_BLOB_CONTAINER:lab-documents}
app.platform.retention-days: ${DOCUMENT_RETENTION_DAYS:30}
app.platform.worker-enabled: ${DOCUMENT_WORKER_ENABLED:true}
management.metrics.tags.application: credit-api
management.health.redis.enabled: ${REDIS_LIMITS_ENABLED:false}
spring.data.redis.repositories.enabled: false
management.tracing.enabled: ${OTEL_ENABLED:false}
management.tracing.sampling.probability: 1.0
management.otlp.tracing.endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
