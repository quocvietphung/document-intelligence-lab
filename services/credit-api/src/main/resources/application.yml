server:
  port: ${PORT:${SERVER_PORT:8080}}
spring:
  application:
    name: credit-api
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8080/realms/credit-intelligence}
          jwk-set-uri: ${KEYCLOAK_JWK_URI:http://localhost:8080/realms/credit-intelligence/protocol/openid-connect/certs}
app:
  security:
    enabled: ${SECURITY_ENABLED:true}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
