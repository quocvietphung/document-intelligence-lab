[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "m365-mcp-poc"
version = "0.2.0"
description = "Local proof of concept: controlled, read-only, grounded Q&A over fictional project documents with optional Entra, Graph and Azure AI boundaries (not live-verified)."
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "msal>=1.30",
  "mcp>=2.0,<3",
  "pypdf>=5.0",
  "PyJWT[crypto]>=2.9",
  "azure-identity>=1.19",
  "opentelemetry-api>=1.27",
  "opentelemetry-sdk>=1.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "reportlab>=4", "ruff>=0.6", "mypy>=1.11", "bandit>=1.7", "pip-audit>=2.7", "build>=1.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
m365_poc = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
filterwarnings = ["error::DeprecationWarning:m365_poc.*"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["fixtures/build_fixtures.py", ".venv*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N", "SIM", "RUF"]
ignore = ["S101", "N818"]  # S101: assert narrows types; N818: domain error names are kept stable across the API

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B017", "N802", "RUF001"]
"fixtures/*" = ["S"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/m365_poc"]
warn_unused_ignores = true
no_implicit_reexport = true
plugins = []

[[tool.mypy.overrides]]
module = ["msal.*", "pypdf.*", "jwt.*", "mcp.*", "opentelemetry.*", "azure.*"]
ignore_missing_imports = true
